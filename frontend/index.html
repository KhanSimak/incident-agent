<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Incident Investigation Agent</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e4e6eb;
    --muted: #8a8f9c;
    --accent: #5b8cff;
    --good: #3ddc97;
    --warn: #ffb454;
    --bad: #ff5f5f;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
  }
  textarea { resize: vertical; min-height: 60px; }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 6px;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #2a2e38; }
  button.danger { background: var(--bad); }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button { flex: 1; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.good { background: rgba(61,220,151,0.15); color: var(--good); }
  .badge.warn { background: rgba(255,180,84,0.15); color: var(--warn); }
  .badge.bad  { background: rgba(255,95,95,0.15);  color: var(--bad); }
  .badge.neutral { background: rgba(138,143,156,0.15); color: var(--muted); }

  .field { margin-bottom: 10px; font-size: 13px; }
  .field .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .field .v { margin-top: 2px; }

  .evidence-item {
    border-left: 2px solid var(--border);
    padding: 6px 10px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .evidence-item.cited { border-left-color: var(--accent); background: rgba(91,140,255,0.06); }
  .evidence-item .tool { color: var(--accent); font-weight: 600; }
  .evidence-item .summary { color: var(--muted); margin-top: 2px; }

  pre {
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-size: 11px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
  .section-title { font-size: 13px; font-weight: 600; margin: 18px 0 8px; color: var(--text); }
  .error-box {
    background: rgba(255,95,95,0.1);
    border: 1px solid var(--bad);
    color: var(--bad);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    margin-top: 10px;
  }

  /* live investigation ticker */
  .live-status {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 10px;
    font-size: 13px;
  }
  .live-status.active { display: flex; }
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(91,140,255,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(91,140,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(91,140,255,0); }
  }
  .live-status .line {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    animation: fadein 0.25s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
  .live-log {
    max-height: 160px; overflow-y: auto; margin-top: 8px;
    display: none;
  }
  .live-log.active { display: block; }
  .live-log .entry {
    font-size: 11px; color: var(--muted); padding: 3px 0;
    border-bottom: 1px solid var(--border);
  }

  /* fault-injection demo panel */
  .demo-panel { margin-top: 20px; }
  .demo-panel .tag {
    font-size: 10px; color: var(--warn); border: 1px solid var(--warn);
    border-radius: 4px; padding: 1px 6px; margin-left: 6px;
  }
</style>
</head>
<body>

<h1>Incident Investigation Agent</h1>
<div class="sub">Phase 1–3 dashboard — triage, investigation, remediation, approval, execution, verification</div>

<div class="layout">

  <!-- LEFT: incident creation + settings -->
  <div class="panel">
    <div class="section-title">API</div>
    <label>Backend URL</label>
    <input id="apiBase" value="http://localhost:8000">

    <div class="section-title">New incident</div>
    <label>Description</label>
    <textarea id="description" placeholder="checkout-service memory usage climbing"></textarea>

    <label>Data source</label>
    <select id="dataSource">
      <option value="live">live (real Docker/Prometheus)</option>
      <option value="fixture">fixture</option>
    </select>

    <div id="scenarioWrap" style="display:none">
      <label>Scenario ID</label>
      <select id="scenarioId"></select>
    </div>

    <button id="submitBtn" style="width:100%">Report incident</button>
    <div id="submitError"></div>

    <div class="live-status" id="liveStatus">
      <div class="pulse-dot"></div>
      <div class="line" id="liveLine">Starting investigation...</div>
    </div>
    <div class="live-log" id="liveLog"></div>

    <div class="section-title">Recent incidents (this session)</div>
    <div id="incidentList" class="empty">None yet</div>
  </div>

  <!-- RIGHT: incident detail -->
  <div class="panel" id="detailPanel">
    <div class="empty">Report an incident, or select one on the left, to see details here.</div>
  </div>

</div>

<!-- FULL-WIDTH: fault-injection demo panel (below the 2-column layout, not a 3rd grid cell) -->
<div class="panel demo-panel">
  <div class="section-title">Fault injection <span class="tag">demo only</span></div>

  <label>Admin token</label>
  <input id="adminToken" type="password" placeholder="only needed for fault injection / traffic">

  <div class="row" style="margin-top:10px">
    <div style="flex:1">
      <label>Service</label>
      <select id="faultService">
        <option value="checkout-service">checkout-service</option>
        <option value="payment-service">payment-service</option>
      </select>
    </div>
    <div style="flex:1">
      <label>Fault mode</label>
      <select id="faultMode">
        <option value="none">none (reset)</option>
        <option value="memory_leak">memory_leak</option>
        <option value="pool_leak">pool_leak</option>
        <option value="fd_leak">fd_leak</option>
        <option value="cpu_saturation">cpu_saturation</option>
        <option value="bad_deploy">bad_deploy</option>
      </select>
    </div>
  </div>
  <button id="btnInjectFault" style="width:100%">Inject / recreate container</button>
  <div id="injectStatus" style="font-size:11px;color:var(--muted);margin-top:4px"></div>

  <label style="margin-top:14px">Traffic (requests to trigger the fault)</label>
  <input id="trafficCount" type="number" value="50" min="1" max="500">
  <button id="btnGenTraffic" class="secondary" style="width:100%">Send traffic</button>
  <div id="trafficStatus" style="font-size:11px;color:var(--muted);margin-top:4px"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let incidents = {};       // incident_id -> last known state (from API responses)
let currentId = null;

function apiBase() { return $("apiBase").value.replace(/\/$/, ""); }

async function api(path, options = {}) {
  const res = await fetch(apiBase() + path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(body.detail || `${res.status} ${res.statusText}`);
  }
  return body;
}

// Same as api(), plus the X-Admin-Token header — used only by the
// fault-injection demo endpoints, which the backend gates with
// require_admin_token(). Every other endpoint uses plain api() and
// needs no token at all.
async function adminApi(path, options = {}) {
  const res = await fetch(apiBase() + path, {
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Token": $("adminToken").value,
    },
    ...options,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(body.detail || `${res.status} ${res.statusText}`);
  }
  return body;
}

function badge(text, kind) {
  return `<span class="badge ${kind}">${text}</span>`;
}

function riskBadge(risk) {
  if (risk === "auto_apply_safe") return badge(risk, "good");
  if (risk === "needs_approval") return badge(risk, "warn");
  if (risk === "do_not_apply") return badge(risk, "bad");
  return badge(risk ?? "—", "neutral");
}

function approvalBadge(status) {
  if (status === "approved") return badge(status, "good");
  if (status === "rejected") return badge(status, "bad");
  if (status === "pending") return badge(status, "warn");
  return badge(status ?? "not_required", "neutral");
}

function execBadge(status) {
  if (status === "succeeded") return badge(status, "good");
  if (status === "failed") return badge(status, "bad");
  return badge(status ?? "not_executed", "neutral");
}

// ---------- data source toggle ----------
$("dataSource").addEventListener("change", async () => {
  const live = $("dataSource").value === "live";
  $("scenarioWrap").style.display = live ? "none" : "block";
  if (!live) {
    try {
      const scenarios = await api("/scenarios");
      $("scenarioId").innerHTML = Object.entries(scenarios)
        .map(([id, s]) => `<option value="${id}">${id} — ${s.primary_service}</option>`)
        .join("");
    } catch (e) {
      $("scenarioId").innerHTML = `<option value="">(could not load scenarios)</option>`;
    }
  }
});

// ---------- create incident (live streaming) ----------
$("submitBtn").addEventListener("click", () => {
  $("submitError").innerHTML = "";
  const description = $("description").value.trim();
  if (!description) return;

  const live = $("dataSource").value === "live";
  const params = new URLSearchParams({ description });
  if (!live) params.set("scenario_id", $("scenarioId").value);

  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "Investigating...";
  $("liveStatus").classList.add("active");
  $("liveLog").classList.add("active");
  $("liveLog").innerHTML = "";
  $("liveLine").textContent = "Starting investigation...";

  const es = new EventSource(`${apiBase()}/incidents/stream?${params.toString()}`);

  es.addEventListener("trace", (e) => {
    const { message } = JSON.parse(e.data);
    $("liveLine").textContent = message;
    $("liveLine").classList.remove("line");
    void $("liveLine").offsetWidth; // restart the fade-in animation
    $("liveLine").classList.add("line");

    const entry = document.createElement("div");
    entry.className = "entry";
    entry.textContent = message;
    $("liveLog").prepend(entry);
  });

  es.addEventListener("done", (e) => {
    const result = JSON.parse(e.data);
    incidents[result.incident_id] = result;
    currentId = result.incident_id;
    renderIncidentList();
    renderDetail(result);

    es.close();
    $("submitBtn").disabled = false;
    $("submitBtn").textContent = "Report incident";
    $("liveStatus").classList.remove("active");
  });

  es.onerror = () => {
    $("submitError").innerHTML = `<div class="error-box">Stream connection failed or closed unexpectedly.</div>`;
    es.close();
    $("submitBtn").disabled = false;
    $("submitBtn").textContent = "Report incident";
    $("liveStatus").classList.remove("active");
  };
});

// ---------- fault injection (demo panel, admin-token gated) ----------
$("btnInjectFault").addEventListener("click", async () => {
  $("injectStatus").textContent = "Applying...";
  try {
    const result = await adminApi("/admin/inject_fault", {
      method: "POST",
      body: JSON.stringify({
        service: $("faultService").value,
        fault_mode: $("faultMode").value,
      }),
    });
    $("injectStatus").textContent = result.ok
      ? `Container recreated with FAULT_MODE=${result.fault_mode}`
      : `Failed: ${result.detail}`;
  } catch (e) {
    $("injectStatus").textContent = `Error: ${e.message}`;
  }
});

$("btnGenTraffic").addEventListener("click", async () => {
  const count = parseInt($("trafficCount").value, 10) || 50;
  $("trafficStatus").textContent = `Sending ${count} requests...`;
  try {
    const result = await adminApi("/admin/generate_traffic", {
      method: "POST",
      body: JSON.stringify({ service: $("faultService").value, count }),
    });
    $("trafficStatus").textContent = `${result.succeeded}/${result.requested} succeeded`;
  } catch (e) {
    $("trafficStatus").textContent = `Error: ${e.message}`;
  }
});

// ---------- incident list ----------
function renderIncidentList() {
  const ids = Object.keys(incidents);
  if (ids.length === 0) {
    $("incidentList").innerHTML = `<div class="empty">None yet</div>`;
    return;
  }
  $("incidentList").className = "";
  $("incidentList").innerHTML = ids.map(id => {
    const inc = incidents[id];
    const active = id === currentId ? "style='border-color:var(--accent)'" : "";
    return `
      <div class="evidence-item" ${active} style="cursor:pointer" data-id="${id}">
        <div class="tool">${id}</div>
        <div class="summary">${(inc.root_cause_hypothesis || "investigating...").slice(0, 60)}</div>
      </div>`;
  }).join("");

  document.querySelectorAll("#incidentList [data-id]").forEach(el => {
    el.addEventListener("click", () => {
      currentId = el.dataset.id;
      renderIncidentList();
      renderDetail(incidents[currentId]);
    });
  });
}

// ---------- detail panel ----------
function field(k, v) {
  return `<div class="field"><div class="k">${k}</div><div class="v">${v}</div></div>`;
}

function renderDetail(state) {
  const id = state.incident_id;
  const evidence = state.full_evidence_gathered || state.evidence || [];

  const evidenceHtml = evidence.map((e, i) => {
    const cited = state.cited_evidence && state.cited_evidence.some(c => c.query === e.query && c.tool === e.tool);
    return `
      <div class="evidence-item ${cited ? "cited" : ""}">
        <div class="tool">[${i}] ${e.tool}</div>
        <div>${escapeHtml(e.query)}</div>
        <div class="summary">${escapeHtml(e.result_summary || "")}</div>
      </div>`;
  }).join("") || `<div class="empty">No evidence gathered</div>`;

  const alertRules = (state.suggested_alert_rules || []).map(r => `
    <div class="evidence-item">
      <div class="tool">${escapeHtml(r.metric)}</div>
      <div>${escapeHtml(r.expr)}  for: ${r.for}</div>
      <div class="summary">${escapeHtml(r.rationale)}</div>
    </div>`).join("") || `<div class="empty">None proposed</div>`;

  $("detailPanel").innerHTML = `
    <div class="section-title">Incident ${id}</div>

    ${field("Severity / Category", `${state.triage?.severity ?? "—"} / ${state.triage?.category ?? "—"}`)}
    ${field("Root cause hypothesis", escapeHtml(state.root_cause_hypothesis ?? "—"))}
    ${field("Confidence", state.confidence != null ? state.confidence.toFixed(2) : "—")}
    ${field("Recommended action", escapeHtml(state.recommended_action ?? "—"))}
    ${field("Risk category", riskBadge(state.risk_category))}
    ${field("Approval status", approvalBadge(state.approval_status))}
    ${field("Remediation action type", state.remediation_action_type ?? "— (no automated action available)")}
    ${field("Execution status", execBadge(state.execution_status))}
    ${state.execution_detail ? field("Execution detail", `<pre>${escapeHtml(state.execution_detail)}</pre>`) : ""}
    ${state.verification_result ? field("Verification", `<pre>${escapeHtml(JSON.stringify(state.verification_result, null, 2))}</pre>`) : ""}

    <div class="section-title">Actions</div>
    <div class="row">
      <button id="btnApprove" class="secondary" ${state.approval_status !== "pending" ? "disabled" : ""}>Approve</button>
      <button id="btnReject" class="danger" ${state.approval_status !== "pending" ? "disabled" : ""}>Reject</button>
    </div>
    <div class="row">
      <button id="btnExecute" class="secondary" ${state.approval_status !== "approved" || !state.remediation_action_type ? "disabled" : ""}>Execute</button>
      <button id="btnVerify" class="secondary" ${state.approval_status !== "approved" ? "disabled" : ""}>Verify</button>
      <button id="btnExport" class="secondary">Export scenario</button>
    </div>
    <div id="actionError"></div>

    <div class="section-title">Suggested alert rules</div>
    ${alertRules}

    <div class="section-title">Cited evidence</div>
    ${(state.cited_evidence || []).map(e => `
      <div class="evidence-item cited">
        <div class="tool">${e.tool}</div>
        <div>${escapeHtml(e.query)}</div>
        <div class="summary">${escapeHtml(e.result_summary || "")}</div>
      </div>`).join("") || `<div class="empty">None</div>`}

    <div class="section-title">Full evidence trace</div>
    ${evidenceHtml}
  `;

  $("btnApprove")?.addEventListener("click", () => decide(id, "approved"));
  $("btnReject")?.addEventListener("click", () => decide(id, "rejected"));
  $("btnExecute")?.addEventListener("click", () => runAction(id, "execute"));
  $("btnVerify")?.addEventListener("click", () => runAction(id, "verify"));
  $("btnExport")?.addEventListener("click", () => exportScenario(id));
}

async function decide(id, decision) {
  try {
    await api(`/incidents/${id}/approval`, {
      method: "POST",
      body: JSON.stringify({ decision }),
    });
    await refresh(id);
  } catch (e) {
    showActionError(e.message);
  }
}

async function runAction(id, kind) {
  try {
    await api(`/incidents/${id}/${kind}`, { method: "POST" });
    await refresh(id);
  } catch (e) {
    showActionError(e.message);
  }
}

async function exportScenario(id) {
  const scenarioId = prompt("scenario_id for this export (e.g. checkout_memory_leak_v1):");
  if (!scenarioId) return;
  try {
    await api(`/incidents/${id}/export_scenario`, {
      method: "POST",
      body: JSON.stringify({ scenario_id: scenarioId }),
    });
    alert(`Exported to app/fixtures/exported/${scenarioId}.json — review before adding to ALL_SCENARIOS.`);
  } catch (e) {
    showActionError(e.message);
  }
}

async function refresh(id) {
  const state = await api(`/incidents/${id}`);
  incidents[id] = { ...incidents[id], ...state };
  renderIncidentList();
  renderDetail(incidents[id]);
}

function showActionError(msg) {
  $("actionError").innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
}

function escapeHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>
</body>
</html>
